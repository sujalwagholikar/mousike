 </head>
 <body>

  <div class="premium-shell" id="appShell">
   <header class="premium-topbar">
    <button aria-label="Mousike Home" class="brand" id="brandHome">
     <img alt="" src="/assets/brand/mousike-mark-static.svg?v=6"/>
     <span>
      <span class="brand-type">
       Mousike
      </span>
      <span class="mousike-brand-sub">
       Sound In motion
      </span>
     </span>
    </button>
    <div class="topbar-center">
     <button aria-label="Home" class="top-home" id="headerHome">
      <svg aria-hidden="true" class="ui-icon">
       <use href="#i-home">
       </use>
      </svg>
     </button>
     <div class="search">
      <svg aria-hidden="true" class="ui-icon">
       <use href="#i-search">
       </use>
      </svg>
      <input aria-autocomplete="list" aria-controls="searchSuggestions" aria-expanded="false" aria-label="Search songs, artists, albums or a mood" autocomplete="off" id="query" placeholder="Songs, artists, or a feeling…" spellcheck="false" type="search"/>
      <kbd>
       /
      </kbd>
      <div class="suggestions" hidden="" id="searchSuggestions" role="listbox">
      </div>
     </div>
    </div>
    <div class="topbar-right">
     <button class="header-discover" id="discover" title="Discover new music">
      <svg aria-hidden="true" class="ui-icon">
       <use href="#i-disc">
       </use>
      </svg>
      <span>
       Discover
      </span>
     </button>
     <button aria-label="Audio studio" class="header-icon" id="topStudio">
      <svg aria-hidden="true" class="ui-icon">
       <use href="#i-settings">
       </use>
      </svg>
     </button>
     <button aria-label="Your profile" class="profile" id="tasteProfileButton">
      <svg aria-hidden="true" class="ui-icon">
       <use href="#i-user">
       </use>
      </svg>
     </button>
    </div>
   </header>
   <div class="workspace">
    <aside aria-label="Library navigation" class="rail">
     <div class="rail-actions">
      <button aria-label="Home" class="nav rail-action active" data-page="home">
       <svg aria-hidden="true" class="ui-icon">
        <use href="#i-home">
        </use>
       </svg>
       <span>
        Home
       </span>
      </button>
      <button aria-label="Search" class="nav rail-action" data-page="search">
       <svg aria-hidden="true" class="ui-icon">
        <use href="#i-search">
        </use>
       </svg>
       <span>
        Search
       </span>
      </button>
      <button aria-label="Your library" class="nav rail-action" data-page="library">
       <svg aria-hidden="true" class="ui-icon">
        <use href="#i-library">
        </use>
       </svg>
       <span>
        Your library
       </span>
      </button>
      <button aria-label="Liked songs" class="nav rail-action" data-page="favorites">
       <svg aria-hidden="true" class="ui-icon">
        <use href="#i-heart">
        </use>
       </svg>
       <span>
        Liked songs
       </span>
      </button>
      <button aria-label="Recently played" class="nav rail-action" data-page="history">
       <svg aria-hidden="true" class="ui-icon">
        <use href="#i-clock">
        </use>
       </svg>
       <span>
        Recently played
       </span>
      </button>
      <button aria-label="Play queue" class="nav rail-action" data-page="queue">
       <svg aria-hidden="true" class="ui-icon">
        <use href="#i-list">
        </use>
       </svg>
       <span>
        Play queue
       </span>
      </button>
      <button aria-label="Settings" class="nav rail-action" id="settingsNav">
       <svg aria-hidden="true" class="ui-icon">
        <use href="#i-settings">
        </use>
       </svg>
       <span>
        Settings
       </span>
      </button>
     </div>
     <div class="rail-divider">
     </div>
     <p class="rail-label">
      YOUR COLLECTION
     </p>
     <button aria-label="Create playlist" class="rail-create" id="railCreate">
      <svg aria-hidden="true" class="ui-icon">
       <use href="#i-plus">
       </use>
      </svg>
      <span>
       Create playlist
      </span>
     </button>
     <div aria-label="Saved playlists and artists" class="rail-library" id="railLibrary">
     </div>
     <button class="rail-taste" id="sidebarTaste">
      <svg aria-hidden="true" class="ui-icon">
       <use href="#i-user">
       </use>
      </svg>
      <span>
       Tune your taste
      </span>
     </button>
     <div class="rail-note">
      Mousike 3.0
      <br/>
      Sound In motion
     </div>
    </aside>
    <main class="main-view" id="main">
     <div class="ambient-wash">
     </div>
     <div class="main-inner">
      <div aria-live="polite" class="content" id="content" tabindex="-1">
      </div>
     </div>
    </main>
    <aside aria-label="Now Playing" class="now-panel" id="nowPanel">
     <div class="now-panel-header">
      <div>
       <span class="panel-kicker">
        YOUR LISTENING SPACE
       </span>
       <h2>
        Now playing
       </h2>
      </div>
      <button aria-label="Close Now Playing" class="panel-close" id="closeNowPanel">
       <svg aria-hidden="true" class="ui-icon">
        <use href="#i-close">
        </use>
       </svg>
      </button>
     </div>
     <div id="sidePanelBody">
     </div>
    </aside>
   </div>
  </div>
  <footer aria-label="Music player" class="player premium-player">
   <div class="now">
    <img alt="Current song artwork" id="cover" src="/assets/images/placeholder.svg"/>
    <div class="meta">
     <strong id="nowtitle">
      Your next favorite awaits
     </strong>
     <small id="nowartist">
      Choose something to play
     </small>
     <span class="player-load-status" id="playerLoadStatus" role="status" aria-live="polite"></span>
    </div>
    <button aria-label="Like current song" aria-pressed="false" class="heart" id="likeNow">
     <svg aria-hidden="true" class="ui-icon">
      <use href="#i-heart">
      </use>
     </svg>
    </button>
   </div>
   <div class="center">
    <div class="controls">
     <button aria-label="Shuffle" class="ic" id="shuffle" title="Shuffle">
      <svg aria-hidden="true" class="ui-icon">
       <use href="#i-shuffle">
       </use>
      </svg>
     </button>
     <button aria-label="Previous track" class="ic" id="prev" title="Previous track">
      <svg aria-hidden="true" class="ui-icon">
       <use href="#i-prev">
       </use>
      </svg>
     </button>
     <button aria-label="Play" class="ic primary" id="toggle" title="Play">
      <svg aria-hidden="true" class="ui-icon">
       <use href="#i-play">
       </use>
      </svg>
     </button>
     <button aria-label="Next track" class="ic" id="next" title="Next track">
      <svg aria-hidden="true" class="ui-icon">
       <use href="#i-next">
       </use>
      </svg>
     </button>
     <button aria-label="Repeat off" class="ic" id="repeat" title="Repeat off">
      <svg aria-hidden="true" class="ui-icon">
       <use href="#i-repeat">
       </use>
      </svg>
     </button>
    </div>
    <div class="progress">
     <span class="time" id="elapsed">
      0:00
     </span>
     <input aria-label="Track position" id="seek" max="100" min="0" step="0.05" type="range" value="0"/>
     <span class="time" id="total">
      0:00
     </span>
    </div>
   </div>
   <div class="right">
    <button aria-label="Audio studio" class="ic" id="studioQuick" title="Audio studio">
     <svg aria-hidden="true" class="ui-icon">
      <use href="#i-settings">
      </use>
     </svg>
    </button>
    <button aria-label="Open full-screen player" class="ic" id="openExpanded" title="Full-screen player">
     <svg aria-hidden="true" class="ui-icon">
      <use href="#i-expand">
      </use>
     </svg>
    </button>
    <button aria-label="Play queue" class="ic" id="queueBtn" title="Play queue">
     <svg aria-hidden="true" class="ui-icon">
      <use href="#i-list">
      </use>
     </svg>
    </button>
    <span class="volume-icon">
     <svg aria-hidden="true" class="ui-icon">
      <use href="#i-volume">
      </use>
     </svg>
    </span>
    <input aria-label="Volume" id="volume" max="100" min="0" type="range" value="75"/>
   </div>
  </footer>
  <audio id="audio" preload="none">
  </audio>
  <audio id="audioNext" preload="none">
  </audio>
  <div aria-live="polite" class="toast" id="appToast" role="status">
  </div>
  <dialog aria-labelledby="textDialogTitle" id="textDialog">
   <form method="dialog">
    <h2 id="textDialogTitle">
     Playlist name
    </h2>
    <input aria-label="Playlist name" autocomplete="off" id="textDialogInput" maxlength="90" type="text"/>
    <div class="dialog-actions">
     <button class="soft-cta" formnovalidate="" value="cancel">
      Cancel
     </button>
     <button class="primary-button" value="ok">
      Save
     </button>
    </div>
   </form>
  </dialog>
  <dialog aria-labelledby="confirmDialogTitle" id="confirmDialog">
   <form method="dialog">
    <h2 id="confirmDialogTitle">
     Are you sure?
    </h2>
    <div class="dialog-actions">
     <button class="soft-cta" value="cancel">
      Cancel
     </button>
     <button class="primary-button" value="ok">
      Confirm
     </button>
    </div>
   </form>
  </dialog>
  <dialog aria-labelledby="tasteDialogTitle" id="tasteDialog">
   <button aria-label="Close taste profile" class="dialog-close" id="closeTasteDialog">
    <svg aria-hidden="true" class="ui-icon">
     <use href="#i-close">
     </use>
    </svg>
   </button>
   <span class="page-kicker">
    YOUR LISTENING PROFILE
   </span>
   <h2 id="tasteDialogTitle">
    Every side of your taste.
   </h2>
   <div class="taste-content">
   </div>
  </dialog>
  <noscript>
   Mousike needs JavaScript for music playback. Please enable JavaScript and reload.
  </noscript>
 </body>
</html>
